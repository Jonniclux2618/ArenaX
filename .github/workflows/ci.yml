name: CI

on:
  push:
    branches: [main, dev, develop]
  pull_request:
    branches: [main, dev, develop]

jobs:
  test-quarantine:
    name: Test quarantine policy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Restore quarantine recovery streaks
        uses: actions/cache@v4
        with:
          path: .github/test-quarantine-history.json
          key: quarantine-history-${{ github.ref }}-${{ github.run_id }}
          restore-keys: |
            quarantine-history-${{ github.ref }}-

      - name: Validate quarantines and report disabled coverage
        run: python3 scripts/check-test-quarantine.py

      - name: Test quarantine policy edge cases
        run: python3 -m unittest scripts/tests/test_check_test_quarantine.py

  secret-scan:
    name: Secret scan (current content + history)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan current content and history for secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMITS: true
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: true

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version-file: .nvmrc
        cache: 'npm'
        cache-dependency-path: frontend/package-lock.json

    - name: Install pinned npm
      run: npm install --global npm@10.9.3
    
    - name: Install dependencies
      run: npm ci

    - name: Check PWA assets
      run: npm run check:pwa-assets

    - name: Lint code
      run: npm run lint

    - name: Type check
      run: npx tsc --noEmit

    - name: Run tests
      run: npm test -- --ci --forceExit --passWithNoTests

    - name: Enforce Performance Budgets (#48)
      run: npm run check:perf-budgets

    - name: Upload Playwright report
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: playwright-report
        path: frontend/playwright-report/
        retention-days: 7

  # Economic simulation smoke scenarios (#234)
  economics-simulation:
    name: Economics simulation (adversarial demand)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run deterministic economic simulation smoke scenarios
        run: python3 scripts/economics_simulation.py --scenarios scripts/economics_scenarios.json --bounds scripts/economics_bounds.json --report target/economics-report.json

      - name: Verify report is reproducible from checked-in inputs
        run: |
          python3 scripts/economics_simulation.py --scenarios scripts/economics_scenarios.json --bounds scripts/economics_bounds.json --report target/economics-report-rerun.json
          python3 - <<'PY'
          import json
          with open("target/economics-report.json", encoding="utf-8") as a, open("target/economics-report-rerun.json", encoding="utf-8") as b:
              first, second = json.load(a), json.load(b)
          if first != second:
              raise SystemExit("Economic simulation report is not reproducible from checked-in inputs")
          PY

      - name: Upload economics report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: economics-report
          path: target/economics-report.json
          retention-days: 7

  # Smart Contracts CI — Reproducible & blocking builds (#51)
  contracts:
    name: Contracts (Soroban)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    defaults:
      run:
        working-directory: contracts
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: rustfmt, clippy

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            contracts/target
          key: ${{ runner.os }}-cargo-contracts-${{ hashFiles('contracts/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-contracts-

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Run workspace tests
        run: cargo test --locked --workspace

      - name: Verify contract invariants
        run: ./specs/verify.sh

      - name: Build optimized Wasm contracts and generate release metadata
        env:
          SOURCE_REVISION: ${{ github.sha }}
        run: |
          ./scripts/build-release-artifacts.sh

      - name: Verify release artifacts
        env:
          SOURCE_REVISION: ${{ github.sha }}
        run: |
          python3 - <<'PY'
          import hashlib
          import json
          import os

          output = "target/wasm32-unknown-unknown/release"
          metadata_path = os.path.join(output, "artifact-metadata.json")
          with open(metadata_path, encoding="utf-8") as metadata_file:
              metadata = json.load(metadata_file)

          wasm_files = {
              name for name in os.listdir(output) if name.endswith(".wasm")
          }
          if not wasm_files:
              raise SystemExit("No Wasm contract artifacts were generated")
          if metadata.get("source_revision") != os.environ["SOURCE_REVISION"]:
              raise SystemExit("Artifact metadata does not match the checked-out revision")
          recorded_files = {artifact["filename"] for artifact in metadata["artifacts"]}
          if recorded_files != wasm_files:
              raise SystemExit("Artifact metadata does not describe every generated Wasm file")

          for artifact in metadata["artifacts"]:
              path = os.path.join(output, artifact["filename"])
              with open(path, "rb") as artifact_file:
                  digest = hashlib.sha256(artifact_file.read()).hexdigest()
              if digest != artifact["sha256"]:
                  raise SystemExit(f"SHA-256 mismatch for {artifact['filename']}")
          PY

      - name: Record per-entrypoint Soroban resource usage (#231)
        env:
          SOURCE_REVISION: ${{ github.sha }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import subprocess
          import sys

          # Representative entrypoints exercised by the deterministic fixtures.
          # Each fixture is a focused integration test that invokes exactly one
          # entrypoint so recorded resource usage is stable across CI runs.
          ENTRYPOINTS = {
              "payment.settle": "resource_budget_payment_settle",
              "payment.refund": "resource_budget_payment_refund",
              "data.record": "resource_budget_data_record",
          }

          budgets_path = os.path.join("specs", "resource-budgets.json")
          with open(budgets_path, encoding="utf-8") as budgets_file:
              budgets = json.load(budgets_file)

          RESOURCES = ("cpu_instructions", "memory_bytes", "ledger_reads", "ledger_writes")
          recorded = {}
          failures = []

          for entrypoint, fixture in ENTRYPOINTS.items():
              # Retry once to absorb transient runner noise; the fixture itself
              # is deterministic so a stable result is expected on retry.
              last_error = None
              for attempt in range(2):
                  proc = subprocess.run(
                      ["cargo", "test", "--locked", "--test", fixture, "--", "--nocapture"],
                      capture_output=True,
                      text=True,
                  )
                  if proc.returncode == 0:
                      last_error = None
                      break
                  last_error = proc.stderr or proc.stdout
              if last_error is not None:
                  failures.append(f"{entrypoint}: fixture {fixture} failed: {last_error.strip()}")
                  continue

              report_path = os.path.join("target", "resource-reports", f"{fixture}.json")
              if not os.path.exists(report_path):
                  failures.append(f"{entrypoint}: missing resource report {report_path}")
                  continue
              with open(report_path, encoding="utf-8") as report_file:
                  report = json.load(report_file)
              recorded[entrypoint] = {r: int(report[r]) for r in RESOURCES}

          os.makedirs("target", exist_ok=True)
          with open(os.path.join("target", "resource-usage.json"), "w", encoding="utf-8") as out:
              json.dump({"source_revision": os.environ["SOURCE_REVISION"], "entrypoints": recorded}, out, indent=2, sort_keys=True)

          for entrypoint, usage in recorded.items():
              budget = budgets["entrypoints"].get(entrypoint)
              if budget is None:
                  failures.append(f"{entrypoint}: no reviewed budget defined in {budgets_path}")
                  continue
              for resource in RESOURCES:
                  limit = int(budget[resource])
                  if usage[resource] > limit:
                      failures.append(
                          f"{entrypoint}: {resource} {usage[resource]} exceeds reviewed budget {limit}"
                      )

          if failures:
              for failure in failures:
                  print(failure, file=sys.stderr)
              raise SystemExit(1)
          PY
