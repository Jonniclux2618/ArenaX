services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_DB: arenax
      POSTGRES_USER: arenax
      POSTGRES_PASSWORD: ${DEV_POSTGRES_PASSWORD:?Run ./scripts/dev-env.sh up first}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - arenax_local_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U arenax -d arenax"]
      interval: 5s
      timeout: 5s
      retries: 12

  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:6380:6379"
    volumes:
      - arenax_local_redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${DEV_MINIO_ROOT_USER:?Run ./scripts/dev-env.sh up first}
      MINIO_ROOT_PASSWORD: ${DEV_MINIO_ROOT_PASSWORD:?Run ./scripts/dev-env.sh up first}
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - arenax_local_minio:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9000/minio/health/ready >/dev/null"]
      interval: 5s
      timeout: 5s
      retries: 12

  rabbitmq:
    image: rabbitmq:3.12-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: ${DEV_RABBITMQ_USER:?Run ./scripts/dev-env.sh up first}
      RABBITMQ_DEFAULT_PASS: ${DEV_RABBITMQ_PASSWORD:?Run ./scripts/dev-env.sh up first}
      RABBITMQ_DEFAULT_VHOST: arenax
    ports:
      - "127.0.0.1:5672:5672"
      - "127.0.0.1:15672:15672"
    volumes:
      - arenax_local_rabbitmq:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  arenax_local_postgres:
  arenax_local_redis:
  arenax_local_minio:
  arenax_local_rabbitmq:
