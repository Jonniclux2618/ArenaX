name: Frontend CI/CD

on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend-cicd.yml'
  pull_request:
    branches: [main]
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend-cicd.yml'

permissions:
  contents: read

concurrency:
  group: frontend-cicd-${{ github.ref }}
  cancel-in-progress: true

env:
  # Production enforces HTTPS-only transport and a least-privilege origin allowlist.
  # Preview/local keep the same policy shape but allow the preview host explicitly
  # (never a wildcard) so credentialed requests stay safe.
  PROD_TRUSTED_ORIGINS: 'https://app.example.com'
  PREVIEW_TRUSTED_ORIGINS: 'https://preview.example.com'

jobs:
  build:
    name: Build frontend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Enforce Performance Budgets (#48)
        working-directory: frontend
        run: npm run check:perf-budgets

      - name: Build
        working-directory: frontend
        env:
          VITE_TRUSTED_ORIGINS: ${{ github.event_name == 'pull_request' && env.PREVIEW_TRUSTED_ORIGINS || env.PROD_TRUSTED_ORIGINS }}
          VITE_ENFORCE_HTTPS: ${{ github.event_name == 'pull_request' && 'false' || 'true' }}
        run: npm run build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
          retention-days: 7

  deploy-preview:
    name: Deploy preview
    if: github.event_name == 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: preview
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist

      - name: Verify preview security headers
        working-directory: frontend
        env:
          TRUSTED_ORIGINS: ${{ env.PREVIEW_TRUSTED_ORIGINS }}
          ENFORCE_HTTPS: 'false'
        run: npm run test:headers

  deploy-production:
    name: Deploy production
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist

      - name: Deploy to production environment
        run: |
          echo "Deploying to production: ${{ vars.PRODUCTION_URL }}"
          echo "Deploy token present: ${{ secrets.DEPLOY_TOKEN != '' }}"
          # TODO: replace with actual deploy command, e.g.:
          # npx vercel --token ${{ secrets.DEPLOY_TOKEN }} --prod --yes
        env:
          DEPLOY_TOKEN: ${{ secrets.DEPLOY_TOKEN }}
          PRODUCTION_URL: ${{ vars.PRODUCTION_URL }}

      - name: Post-deployment health check
        run: |
          echo "Running health check against ${{ vars.PRODUCTION_URL }}"
          PRODUCTION_URL="${{ vars.PRODUCTION_URL }}"
          if [ -z "$PRODUCTION_URL" ]; then
            echo "PRODUCTION_URL not configured — skipping health check"
            exit 0
          fi
          MAX_RETRIES=5
          RETRY_DELAY=10
          for i in $(seq 1 $MAX_RETRIES); do
            echo "Health check attempt $i/$MAX_RETRIES..."
            if curl -f -s -o /dev/null -w "%{http_code}" "${PRODUCTION_URL}/api/health" | grep -q "^2"; then
              echo "Health check passed!"
              exit 0
            fi
            echo "Health check failed, retrying in ${RETRY_DELAY}s..."
            sleep $RETRY_DELAY
          done
          echo "Health check failed after $MAX_RETRIES attempts"
          exit 1
