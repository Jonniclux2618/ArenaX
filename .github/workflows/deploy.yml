name: Deploy (blue/green)

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "frontend/**"
      - "deploy/**"
      - "scripts/deploy/**"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:
    inputs:
      canary_weight:
        description: "Percent of traffic to send to the canary phase"
        default: "10"
      canary_bake_seconds:
        description: "Seconds to hold the canary split before full cutover"
        default: "60"
      canary_max_error_rate_percent:
        description: "Maximum canary HTTP error rate percent"
        default: "1"
      canary_max_p95_latency_ms:
        description: "Maximum canary p95 latency in milliseconds"
        default: "500"
      rehearsal_network:
        description: "Testnet network for the contract rehearsal (testnet only)"
        default: "testnet"
      rehearsal_identity:
        description: "Testnet identity used to sign rehearsal transactions"
        default: "rehearsal"

jobs:
  release-checklist:
    name: Production readiness & release checklist
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Verify release checklist is present
        run: |
          test -f docs/RELEASE_CHECKLIST.md || {
            echo "::error::docs/RELEASE_CHECKLIST.md is missing; a release cannot be evaluated without it."
            exit 1
          }

      - name: Publish checklist to the run summary
        run: |
          {
            echo "## Production readiness & release checklist"
            echo ""
            echo "Every item below must carry an evidence link or an explicit not-applicable rationale."
            echo "Release blockers must be cleared before cutover; post-release monitoring owners are tracked after cutover."
            echo ""
            cat docs/RELEASE_CHECKLIST.md
          } >> "$GITHUB_STEP_SUMMARY"

  build-and-push:
    name: Build & push images
    runs-on: ubuntu-latest
    needs: release-checklist
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    outputs:
      image_tag: ${{ steps.tag.outputs.image_tag }}
      backend_digest: ${{ steps.backend.outputs.digest }}
      frontend_digest: ${{ steps.frontend.outputs.digest }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Compute image tag
        id: tag
        run: echo "image_tag=${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build & push backend image
        id: backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/backend:${{ steps.tag.outputs.image_tag }}
            ghcr.io/${{ github.repository }}/backend:latest
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.tag.outputs.image_tag }}
            org.opencontainers.image.created=${{ github.event.repository.updated_at }}
          build-args: |
            SOURCE_REVISION=${{ github.sha }}
            BUILD_VERSION=${{ steps.tag.outputs.image_tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & push frontend image
        id: frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/frontend:${{ steps.tag.outputs.image_tag }}
            ghcr.io/${{ github.repository }}/frontend:latest
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.tag.outputs.image_tag }}
            org.opencontainers.image.created=${{ github.event.repository.updated_at }}
          build-args: |
            SOURCE_REVISION=${{ github.sha }}
            BUILD_VERSION=${{ steps.tag.outputs.image_tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Attest backend image provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: ghcr.io/${{ github.repository }}/backend
          subject-digest: ${{ steps.backend.outputs.digest }}
          push-to-registry: true

      - name: Attest frontend image provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: ghcr.io/${{ github.repository }}/frontend
          subject-digest: ${{ steps.frontend.outputs.digest }}
          push-to-registry: true

      - name: Record image digests
        run: |
          echo "backend digest: ${{ steps.backend.outputs.digest }}"
          echo "frontend digest: ${{ steps.frontend.outputs.digest }}"
          echo "source revision: ${{ github.sha }}"

  contract-manifest:
    name: Contract deployment manifest
    runs-on: ubuntu-latest
    needs: release-checklist
    permissions:
      contents: read
    outputs:
      manifest_hash: ${{ steps.manifest.outputs.manifest_hash }}
      wasm_hash: ${{ steps.manifest.outputs.wasm_hash }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Reproducible contract build
        run: |
          set -euo pipefail
          cargo build --manifest-path contracts/Cargo.toml \
            --target wasm32-unknown-unknown --release --locked

      - name: Compute WASM hash and assemble manifest
        id: manifest
        run: |
          set -euo pipefail
          wasm="contracts/target/wasm32-unknown-unknown/release/payments.wasm"
          test -f "$wasm" || { echo "::error::Contract artifact $wasm not found."; exit 1; }
          wasm_hash="$(sha256sum "$wasm" | awk '{print $1}')"
          rustc_version="$(rustc --version)"
          cargo_version="$(cargo --version)"
          manifest="deploy/contract-manifest.json"
          test -f "$manifest" || { echo "::error::Approved manifest $manifest is missing."; exit 1; }
          approved_hash="$(jq -r '.wasm_hash' "$manifest")"
          approved_commit="$(jq -r '.source_commit' "$manifest")"
          if [ "$approved_hash" != "$wasm_hash" ]; then
            echo "::error::WASM hash mismatch: approved=$approved_hash rebuilt=$wasm_hash"
            exit 1
          fi
          if [ "$approved_commit" != "$GITHUB_SHA" ]; then
            echo "::error::Source commit mismatch: approved=$approved_commit current=$GITHUB_SHA"
            exit 1
          fi
          manifest_hash="$(sha256sum "$manifest" | awk '{print $1}')"
          echo "wasm_hash=$wasm_hash" >> "$GITHUB_OUTPUT"
          echo "manifest_hash=$manifest_hash" >> "$GITHUB_OUTPUT"
          {
            echo "## Contract deployment manifest"
            echo "- Source commit: \`$GITHUB_SHA\`"
            echo "- Toolchain: \`$rustc_version\` / \`$cargo_version\`"
            echo "- WASM hash: \`$wasm_hash\` (matches approved manifest)"
            echo "- Manifest hash: \`$manifest_hash\`"
            echo "- Network: \`$(jq -r '.network' "$manifest")\`"
            echo "- Contract ID: \`$(jq -r '.contract_id' "$manifest")\`"
            echo "- Approvers: $(jq -r '.approvers | join(", ")' "$manifest")"
          } >> "$GITHUB_STEP_SUMMARY"

  deploy:
    name: Blue/green deploy
    runs-on: ubuntu-latest
    needs: [build-and-push, contract-manifest]
    permissions:
      contents: read
      attestations: read
      packages: read
    environment: production
    env:
      # Production transport + origin policy. HTTPS-only, least-privilege CORS.
      # Credentialed requests are enabled, so wildcard origins are forbidden.
      SECURITY_ENV: production
      FORCE_HTTPS: "true"
      HSTS_MAX_AGE: "63072000"
      HSTS_INCLUDE_SUBDOMAINS: "true"
      HSTS_PRELOAD: "true"
      COOKIE_SECURE: "true"
      COOKIE_SAME_SITE: "Lax"
      CORS_ALLOW_CREDENTIALS: "true"
      CORS_ALLOWED_ORIGINS: ${{ vars.CORS_ALLOWED_ORIGINS }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Verify image signatures and provenance
        env:
          GH_TOKEN: ${{ github.token }}
          BACKEND_DIGEST: ${{ needs.build-and-push.outputs.backend_digest }}
          FRONTEND_DIGEST: ${{ needs.build-and-push.outputs.frontend_digest }}
        run: |
          set -euo pipefail
          backend="ghcr.io/${GITHUB_REPOSITORY}/backend@${BACKEND_DIGEST}"
          frontend="ghcr.io/${GITHUB_REPOSITORY}/frontend@${FRONTEND_DIGEST}"
          workflow="${GITHUB_REPOSITORY}/.github/workflows/deploy.yml"
          gh attestation verify "oci://${backend}" \
            --repo "$GITHUB_REPOSITORY" \
            --signer-workflow "$workflow" \
            --source-ref "refs/heads/main" \
            --source-digest "$GITHUB_SHA"
          gh attestation verify "oci://${frontend}" \
            --repo "$GITHUB_REPOSITORY" \
            --signer-workflow "$workflow" \
            --source-ref "refs/heads/main" \
            --source-digest "$GITHUB_SHA"
          {
            echo "## Release provenance verification"
            echo "- Source revision: \`$GITHUB_SHA\`"
            echo "- Backend: \`$backend\` — verified"
            echo "- Frontend: \`$frontend\` — verified"
            echo "- Signer workflow: \`$workflow\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Verify approved contract manifest hash
        env:
          APPROVED_MANIFEST_HASH: ${{ needs.contract-manifest.outputs.manifest_hash }}
          APPROVED_WASM_HASH: ${{ needs.contract-manifest.outputs.wasm_hash }}
        run: |
          set -euo pipefail
          manifest="deploy/contract-manifest.json"
          test -f "$manifest" || { echo "::error::Approved manifest $manifest is missing."; exit 1; }
          current_hash="$(sha256sum "$manifest" | awk '{print $1}')"
          if [ "$current_hash" != "$APPROVED_MANIFEST_HASH" ]; then
            echo "::error::Manifest hash mismatch: approved=$APPROVED_MANIFEST_HASH current=$current_hash"
            exit 1
          fi
          current_wasm="$(jq -r '.wasm_hash' "$manifest")"
          if [ "$current_wasm" != "$APPROVED_WASM_HASH" ]; then
            echo "::error::WASM hash mismatch: approved=$APPROVED_WASM_HASH manifest=$current_wasm"
            exit 1
          fi
          echo "Approved manifest hash $APPROVED_MANIFEST_HASH verified against artifact $APPROVED_WASM_HASH."

      - name: Validate production origin policy
        run: |
          set -euo pipefail
          origins="${CORS_ALLOWED_ORIGINS:-}"
          if [ -z "$origins" ]; then
            echo "::error::CORS_ALLOWED_ORIGINS must be set for production (no wildcard allowed)."
            exit 1
          fi
          IFS=',' read -ra entries <<< "$origins"
          for origin in "${entries[@]}"; do
            origin="$(echo "$origin" | xargs)"
            [ -z "$origin" ] && continue
            if [ "$origin" = "*" ]; then
              echo "::error::Wildcard origin '*' is not permitted with credentialed requests."
              exit 1
            fi
            case "$origin" in
              https://*) ;;
              *)
                echo "::error::Origin '$origin' must use https:// in production."
                exit 1
                ;;
            esac
          done
          echo "Production origin policy OK: $origins"

      - name: Run blue/green deploy on the deploy host
        uses: appleboy/ssh-action@v1.2.0
        env:
          SECURITY_ENV: ${{ env.SECURITY_ENV }}
          FORCE_HTTPS: ${{ env.FORCE_HTTPS }}
          HSTS_MAX_AGE: ${{ env.HSTS_MAX_AGE }}
          HSTS_INCLUDE_SUBDOMAINS: ${{ env.HSTS_INCLUDE_SUBDOMAINS }}
          HSTS_PRELOAD: ${{ env.HSTS_PRELOAD }}
          COOKIE_SECURE: ${{ env.COOKIE_SECURE }}
          COOKIE_SAME_SITE: ${{ env.COOKIE_SAME_SITE }}
          CORS_ALLOW_CREDENTIALS: ${{ env.CORS_ALLOW_CREDENTIALS }}
          CORS_ALLOWED_ORIGINS: ${{ env.CORS_ALLOWED_ORIGINS }}
          SOURCE_REVISION: ${{ github.sha }}
          IMAGE_TAG: ${{ needs.build-and-push.outputs.image_tag }}
          VERIFICATION_RUN_ID: ${{ github.run_id }}
          BACKEND_IMAGE_REF: ghcr.io/${{ github.repository }}/backend@${{ needs.build-and-push.outputs.backend_digest }}
          FRONTEND_IMAGE_REF: ghcr.io/${{ github.repository }}/frontend@${{ needs.build-and-push.outputs.frontend_digest }}
          PROVENANCE_VERIFIED: "true"
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_SSH_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          command_timeout: 30m
          envs: SECURITY_ENV,FORCE_HTTPS,HSTS_MAX_AGE,HSTS_INCLUDE_SUBDOMAINS,HSTS_PRELOAD,COOKIE_SECURE,COOKIE_SAME_SITE,CORS_ALLOW_CREDENTIALS,CORS_ALLOWED_ORIGINS,SOURCE_REVISION,IMAGE_TAG,VERIFICATION_RUN_ID,BACKEND_IMAGE_REF,FRONTEND_IMAGE_REF,PROVENANCE_VERIFIED
          script: |
            cd /opt/arenax
            git fetch --depth 1 origin main
            git checkout origin/main -- deploy scripts/deploy
            export CANARY_WEIGHT=${{ github.event.inputs.canary_weight || '10' }}
            export CANARY_BAKE_SECONDS=${{ github.event.inputs.canary_bake_seconds || '60' }}
            export CANARY_MAX_ERROR_RATE_PERCENT=${{ github.event.inputs.canary_max_error_rate_percent || '1' }}
            export CANARY_MAX_P95_LATENCY_MS=${{ github.event.inputs.canary_max_p95_latency_ms || '500' }}
            export CANARY_CRITICAL_JOURNEY_URL="http://localhost:8080/api/health/ready"
            # Transactional rollout: the deploy script must gate traffic shift on
            # migration compatibility and readiness. If either gate fails it
            # exits non-zero BEFORE shifting traffic, leaving the prior release
            # serving. Rollback restores the previous artifact by digest and
            # never reverses schema destructively.
            ./scripts/deploy/blue-green-deploy.sh

      - name: Verify security headers on deployed services
        uses: appleboy/ssh-action@v1.2.0
        env:
          CORS_ALLOWED_ORIGINS: ${{ env.CORS_ALLOWED_ORIGINS }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_SSH_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          envs: CORS_ALLOWED_ORIGINS
          script: |
            set -euo pipefail
            cd /opt/arenax
            primary_origin="$(echo "$CORS_ALLOWED_ORIGINS" | cut -d',' -f1 | xargs)"
            if [ -z "$primary_origin" ]; then
              echo "::error::No primary origin configured for header verification."
              exit 1
            fi
            headers="$(curl -fsSI "$primary_origin" || true)"
            echo "$headers"
            echo "$headers" | grep -qi '^strict-transport-security:' || { echo "::error::Missing Strict-Transport-Security header"; exit 1; }
            echo "$headers" | grep -qi '^x-content-type-options: *nosniff' || { echo "::error::Missing X-Content-Type-Options: nosniff"; exit 1; }
            echo "$headers" | grep -qi '^x-frame-options:' || { echo "::error::Missing X-Frame-Options header"; exit 1; }
            echo "$headers" | grep -qi '^referrer-policy:' || { echo "::error::Missing Referrer-Policy header"; exit 1; }
            if echo "$headers" | grep -qi '^access-control-allow-origin: *\*'; then
              echo "::error::Wildcard Access-Control-Allow-Origin is not permitted."
              exit 1
            fi
            echo "Security header verification passed."

      - name: Surface deployment metrics
        if: always()
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_SSH_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            cd /opt/arenax
            echo "Release: ${{ needs.build-and-push.outputs.image_tag }} (rev ${{ github.sha }})"
            echo "Backend digest: ${{ needs.build-and-push.outputs.backend_digest }}"
            echo "Frontend digest: ${{ needs.build-and-push.outputs.frontend_digest }}"
            echo "Last 5 deployments:"
            tail -n 5 deploy/metrics/deployments.jsonl || true
