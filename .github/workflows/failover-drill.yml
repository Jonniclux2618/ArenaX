name: Isolated Database Failover Drill

on:
  schedule:
    - cron: '0 4 1 * *'
  workflow_dispatch: {}

permissions:
  contents: read
  issues: write

jobs:
  postgres-failover:
    name: Promote isolated streaming standby
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run disposable failover drill
        env:
          DRILL_EVIDENCE_DIR: ${{ runner.temp }}/failover-drill
          DRILL_MAX_RTO_SECONDS: '3600'
        run: bash backend/scripts/failover-drill.sh

      - name: Track failed drill as assigned remediation
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Automated DR drill failed (run ${context.runId})`,
              body: [
                `The isolated PostgreSQL failover drill failed.`,
                ``,
                `- Run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
                `- Evidence artifact: failover-drill-${context.runId}`,
                `- Owner: ${context.repo.owner} (Infrastructure)`,
                `- Review the evidence, record the RTO/RPO gap, and track corrective actions to closure.`,
              ].join('\n'),
              assignees: [context.repo.owner],
              labels: ['area:infrastructure'],
            });

      - name: Retain drill evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: failover-drill-${{ github.run_id }}
          path: ${{ runner.temp }}/failover-drill/*.json
          retention-days: 90
          if-no-files-found: warn
